<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FL Tracker">
<meta name="theme-color" content="#0f0f11">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Arjun FL Hours Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #0f0f11; --surface: #17171a; --surface2: #1e1e23;
    --border: #2a2a32; --accent: #c8f060; --accent2: #60c8f0;
    --accent3: #f060c8; --text: #e8e8ec; --text2: #888896;
    --text3: #555560; --danger: #f06060;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Mono', monospace; min-height: 100vh; overflow-x: hidden;
    /* safe area for iPhone notch */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(200,240,96,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(200,240,96,0.025) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  .app { position: relative; z-index: 1; max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .month-nav { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; }
  .month-nav button { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 20px; padding: 2px 6px; border-radius: 6px; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
  .month-nav button:active { background: var(--border); color: var(--accent); }
  .month-label { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; min-width: 120px; text-align: center; }
  .rate-banner { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
  .rate-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 180px; }
  .rate-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text3); white-space: nowrap; }
  .rate-input-wrap { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; transition: border-color 0.15s; flex: 1; }
  .rate-input-wrap:focus-within { border-color: var(--accent); }
  .currency-symbol { color: var(--accent); font-size: 16px; font-weight: 500; }
  .rate-input { background: none; border: none; color: var(--text); font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; width: 100%; outline: none; }
  .rate-input::placeholder { color: var(--text3); }
  .summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .summary-card.c-green { background: linear-gradient(135deg,#1a2010,#111a0a); border-color: var(--accent); }
  .summary-card.c-blue  { background: linear-gradient(135deg,#101a1e,#0a1318); border-color: var(--accent2); }
  .summary-card.c-pink  { background: linear-gradient(135deg,#1a1020,#110a18); border-color: var(--accent3); }
  .sc-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text3); margin-bottom: 6px; }
  .sc-value { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 22px; line-height: 1; }
  .sc-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .section-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--text2); margin-bottom: 12px; }
  .tabs-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .tab { background: var(--surface); border: 1px solid var(--border); color: var(--text2); font-family: 'DM Mono', monospace; font-size: 13px; padding: 8px 16px; border-radius: 100px; cursor: pointer; transition: all 0.15s; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .tab:active { opacity: 0.7; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #0f0f11; font-weight: 600; }
  .tab-add { background: var(--accent); border: none; color: #0f0f11; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; padding: 8px 18px; border-radius: 100px; cursor: pointer; transition: all 0.15s; box-shadow: 0 0 16px rgba(200,240,96,0.35); -webkit-tap-highlight-color: transparent; }
  .tab-add:active { opacity: 0.8; }
  .client-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .client-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--surface2); flex-wrap: wrap; gap: 10px; }
  .client-name-wrap { display: flex; align-items: center; gap: 10px; }
  .client-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .client-name-input { background: none; border: none; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); outline: none; min-width: 80px; max-width: 180px; }
  .client-rate-override { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .override-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; }
  .override-toggle { background: var(--surface); border: 1px solid var(--border); color: var(--text2); font-family: 'DM Mono', monospace; font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
  .override-toggle.active { border-color: var(--accent2); color: var(--accent2); background: rgba(96,200,240,0.08); }
  .mode-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text2); font-family: 'DM Mono', monospace; font-size: 12px; padding: 5px 12px; border-radius: 20px; cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
  .mode-btn:active { opacity: 0.7; }
  .mode-active { background: rgba(200,240,96,0.15); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .client-custom-rate { display: flex; align-items: center; gap: 6px; background: rgba(96,200,240,0.08); border: 1px solid rgba(96,200,240,0.3); border-radius: 8px; padding: 5px 12px; }
  .client-custom-rate input { background: none; border: none; color: var(--accent2); font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; width: 70px; outline: none; }
  .delete-client-btn { background: none; border: 1px solid var(--border); color: var(--text3); font-size: 13px; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-family: 'DM Mono', monospace; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
  .delete-client-btn:active { border-color: var(--danger); color: var(--danger); }
  .log-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .log-table { width: 100%; border-collapse: collapse; min-width: 400px; }
  .log-table th { padding: 10px 14px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text3); border-bottom: 1px solid var(--border); font-weight: 400; }
  .log-table th.right, .log-table td.right { text-align: right; }
  .log-table tr.entry-row { border-bottom: 1px solid rgba(42,42,50,0.7); }
  .log-table tr.entry-row:last-child { border-bottom: none; }
  .log-table td { padding: 8px 14px; font-size: 13px; vertical-align: middle; }
  .date-input { background: none; border: 1px solid var(--border); color: var(--text2); font-family: 'DM Mono', monospace; font-size: 12px; padding: 5px 8px; border-radius: 6px; outline: none; max-width: 130px; }
  .hm-wrap { display: flex; align-items: center; gap: 4px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; transition: border-color 0.15s; width: fit-content; }
  .hm-wrap:focus-within { border-color: var(--accent); }
  .time-select {
    background: none; border: none; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500;
    outline: none; cursor: pointer; -webkit-appearance: none; appearance: none;
    text-align: center; padding: 0 2px;
  }
  .time-select option { background: #1e1e23; color: var(--text); }
  .hm-input { background: none; border: none; color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; text-align: center; outline: none; -moz-appearance: textfield; }
  .hm-input::-webkit-inner-spin-button, .hm-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .hm-input.hr-input { width: 36px; }
  .hm-input.min-input { width: 28px; }
  .hm-sep { color: var(--text3); font-size: 13px; }
  .amount-cell { font-weight: 500; color: var(--accent); font-size: 14px; white-space: nowrap; }
  .notes-input { background: none; border: none; color: var(--text2); font-family: 'DM Mono', monospace; font-size: 12px; outline: none; width: 100%; min-width: 70px; }
  .notes-input::placeholder { color: var(--text3); }
  .del-row-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 6px 10px; border-radius: 6px; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
  .del-row-btn:active { color: var(--danger); }
  .add-row-area { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface2); }
  .add-row-btn { background: rgba(200,240,96,0.1); border: 1px solid var(--accent); color: var(--accent); font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; padding: 10px 20px; border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; width: 100%; }
  .add-row-btn:active { background: rgba(200,240,96,0.22); }
  .advance-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(96,200,240,0.04); border-top: 1px solid var(--border); flex-wrap: wrap; }
  .advance-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent2); white-space: nowrap; }
  .advance-field { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .advance-field-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); white-space: nowrap; }
  .advance-input-wrap { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid rgba(96,200,240,0.3); border-radius: 8px; padding: 6px 12px; }
  .advance-input-wrap:focus-within { border-color: var(--accent2); }
  .advance-input { background: none; border: none; color: var(--accent2); font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; width: 110px; outline: none; -moz-appearance: textfield; }
  .advance-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .advance-credit .advance-input-wrap { border-color: rgba(240,96,200,0.35); background: rgba(240,96,200,0.04); }
  .advance-credit .advance-input-wrap:focus-within { border-color: var(--accent3); }
  .advance-credit .advance-input, .advance-credit .currency-symbol { color: var(--accent3); }
  .advance-total { display: flex; align-items: center; gap: 6px; border-left: 1px solid var(--border); padding-left: 12px; font-size: 11px; color: var(--text3); }
  .advance-total strong { color: var(--accent); font-family: 'Syne', sans-serif; font-size: 15px; }
  .advance-hint { font-size: 11px; color: var(--text3); }
  .client-footer { display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface2); flex-wrap: wrap; }
  .footer-stat { text-align: right; }
  .footer-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text3); margin-bottom: 2px; }
  .footer-stat-value { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; }
  .export-btn { background: rgba(240,96,200,0.1); border: 1px solid var(--accent3); color: var(--accent3); font-family: 'Syne', sans-serif; font-weight: 700; font-size: 12px; padding: 8px 16px; border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .export-btn:active { background: rgba(240,96,200,0.2); }
  .backup-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); font-family: 'DM Mono', monospace; font-size: 12px; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .backup-btn:active { border-color: var(--accent2); color: var(--accent2); }
  .engagement-ledger { border-top: 1px solid var(--border); background: #151519; padding: 14px 16px; }
  .engagement-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .engagement-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; }
  .engagement-sub { color: var(--text3); font-size: 10px; margin-top: 3px; }
  .engagement-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .engagement-control { display: flex; flex-direction: column; gap: 4px; }
  .engagement-control label { color: var(--text3); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
  .engagement-control input, .engagement-control select { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); font-family: 'DM Mono', monospace; font-size: 11px; padding: 6px 8px; border-radius: 6px; outline: none; }
  .party-list { display: grid; gap: 10px; }
  .party-item { position: relative; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
  .party-main { display: grid; grid-template-columns: minmax(140px,1fr) minmax(110px,150px) auto auto; gap: 10px; align-items: end; padding: 10px 48px 10px 10px; }
  .party-main > .mini-btn { position: absolute; top: 10px; right: 10px; width: 30px; }
  .party-field { display: flex; flex-direction: column; gap: 4px; }
  .party-field label { color: var(--text3); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
  .party-field input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; padding: 7px 8px; border-radius: 6px; min-width: 0; width: 100%; outline: none; }
  .party-stat { min-width: 82px; }
  .party-stat-label { color: var(--text3); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .party-stat-value { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }
  .party-payments { border-top: 1px solid var(--border); padding: 8px 10px; background: rgba(96,200,240,0.025); }
  .payment-row, .payment-add { display: grid; grid-template-columns: 125px 120px minmax(120px,1fr) 34px; gap: 8px; align-items: center; }
  .payment-row { padding: 5px 0; color: var(--text2); font-size: 11px; }
  .payment-add { margin-top: 7px; }
  .payment-add input { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); font-family: 'DM Mono', monospace; font-size: 11px; padding: 6px 7px; border-radius: 6px; min-width: 0; width: 100%; outline: none; }
  .mini-btn { background: none; border: 1px solid var(--border); color: var(--text2); border-radius: 6px; height: 30px; cursor: pointer; font-size: 15px; }
  .mini-btn.add { border-color: var(--accent2); color: var(--accent2); }
  .party-add-btn { margin-top: 10px; background: rgba(200,240,96,0.08); border: 1px solid var(--accent); color: var(--accent); font-family: 'DM Mono', monospace; font-size: 11px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  .legacy-payments { margin-top: 10px; color: var(--text3); font-size: 10px; display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .legacy-payments input { accent-color: var(--accent2); }
  .engagement-totals { display: grid; grid-template-columns: repeat(3,minmax(110px,1fr)); gap: 8px; margin-top: 12px; }
  .engagement-total { border-top: 1px solid var(--border); padding-top: 8px; }
  .engagement-total span { color: var(--text3); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; display: block; }
  .engagement-total strong { font-family: 'Syne', sans-serif; font-size: 16px; display: block; margin-top: 3px; }
  @media (max-width: 680px) {
    .party-main { grid-template-columns: 1fr 1fr; }
    .party-stat { min-width: 0; }
    .payment-row, .payment-add { grid-template-columns: 1fr 1fr 34px; }
    .payment-row .payment-note, .payment-add .payment-note { grid-column: 1 / -2; }
    .engagement-totals { grid-template-columns: 1fr; }
  }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: 0; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 24px 24px 0 0; padding: 28px 24px calc(28px + env(safe-area-inset-bottom)); width: 100%; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .modal-backdrop.open .modal { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 20px; }
  .modal-field { margin-bottom: 16px; }
  .modal-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text3); margin-bottom: 6px; display: block; }
  .modal-input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: 'DM Mono', monospace; font-size: 16px; padding: 12px 14px; border-radius: 10px; width: 100%; outline: none; transition: border-color 0.15s; }
  .modal-input:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 10px; margin-top: 24px; }
  .btn-primary { flex: 1; background: var(--accent); border: none; color: #0f0f11; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 15px; padding: 14px; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn-primary:active { opacity: 0.85; }
  .btn-secondary { flex: 1; background: none; border: 1px solid var(--border); color: var(--text2); font-family: 'DM Mono', monospace; font-size: 13px; padding: 14px; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn-secondary:active { border-color: var(--text2); }
  .empty-state { padding: 40px 24px; text-align: center; color: var(--text3); font-size: 13px; }
  .empty-state .big { font-size: 36px; margin-bottom: 12px; }
  .toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface); border: 1px solid var(--accent); color: var(--accent); font-family: 'DM Mono', monospace; font-size: 13px; padding: 10px 20px; border-radius: 100px; z-index: 200; transition: transform 0.3s ease; white-space: nowrap; }
  .toast:empty { display: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  /* sync indicator */
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; margin-left: 8px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  /* cloud sync */
  .sync-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text2); }
  .sync-btn:active { opacity: 0.7; }
  .sync-btn .cloud-icon { font-size: 15px; line-height: 1; }
  .sync-btn.syncing .cloud-icon { animation: spin 0.8s linear infinite; }
  .sync-btn.synced { border-color: var(--accent); color: var(--accent); }
  .sync-btn.error { border-color: var(--danger); color: var(--danger); }
  .sync-btn.off { border-color: var(--border); color: var(--text3); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-label { font-size: 11px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Arjun <span>FL</span> Tracker</div>
    <button class="sync-btn off" id="syncBtn" title="Sync with Google Drive">
      <span class="cloud-icon">☁</span><span class="sync-label" id="syncLabel">Not signed in</span>
    </button>
    <div class="month-nav">
      <button id="btnPrev">&#8249;</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="btnNext">&#8250;</button>
    </div>
  </header>

  <div class="rate-banner">
    <div class="rate-group">
      <span class="rate-label">Default Rate / hr</span>
      <div class="rate-input-wrap">
        <span class="currency-symbol">&#8377;</span>
        <input type="number" class="rate-input" id="defaultRate" placeholder="0" min="0" inputmode="numeric">
      </div>
    </div>
    <button class="backup-btn" id="btnBackup">Backup data</button>
    <button class="export-btn" id="btnExport">&#11015; Export CSV</button>
  </div>

  <div class="summary-row" id="summaryRow"></div>
  <div class="section-title">Clients</div>
  <div class="tabs-row" id="tabsRow"></div>
  <div id="clientPanel"></div>
</div>

<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">New Client</div>
    <div class="modal-field">
      <label class="modal-label">Client Name</label>
      <input type="text" class="modal-input" id="newClientName" placeholder="e.g. Acme Corp" maxlength="30" autocomplete="off">
    </div>
    <div class="modal-btns">
      <button class="btn-secondary" id="btnModalCancel">Cancel</button>
      <button class="btn-primary"   id="btnModalConfirm">Add Client</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const SHORT   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOTS    = ['#c8f060','#60c8f0','#f060c8','#f0c060','#60f0a0','#f09060'];

let S = { defaultRate:0, month:new Date().getMonth(), year:new Date().getFullYear(), activeClient:null, clients:[], updatedAt:0 };

// ── Cloud sync config ─────────────────────────────────────────────────────────
// Replace with your own OAuth Client ID from Google Cloud Console (see README).
// Authorized JS origins must include the exact origin where this is hosted (e.g. https://your-site.netlify.app).
const GDRIVE_CLIENT_ID = '968068632821-fg9pgqsjhu0h2t24hedlfgm5rlsrb7r0.apps.googleusercontent.com';
const DRIVE_STATE_FILE = 'fl-tracker-state.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const LS_FILEID_KEY = 'arjun_fl_drive_fileid';

function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem('arjun_fl_v1', JSON.stringify(S)); } catch(e){}
  scheduleCloudPush();
}
function normalizeClient(c) {
  if (!c.advances) c.advances={};
  if (!c.advanceCredits) c.advanceCredits={};
  if (!c.entries) c.entries=[];
  if (c.billingMode === 'onetime' && c.oneTimeFee == null) {
    const legacyTotal = c.entries.reduce((s,e)=>s+(Number(e.fixedAmt)||0),0);
    if (legacyTotal > 0) c.oneTimeFee = legacyTotal;
  }
  if (!Array.isArray(c.oneTimeParties)) c.oneTimeParties=[];
  c.oneTimeParties.forEach(p => { if (!Array.isArray(p.payments)) p.payments=[]; });
  if (c.billingMode === 'onetime' && c.oneTimeLedgerEnabled == null && Number(c.oneTimeFee)>0) {
    c.oneTimeParties=[{id:uid(),name:'General engagement',agreedAmount:Number(c.oneTimeFee)||0,payments:[]}];
    c.oneTimeLedgerEnabled=true;
  }
}

function load() {
  try {
    const raw = localStorage.getItem('arjun_fl_v1') || localStorage.getItem('hours_tracker_v2') || localStorage.getItem('arjun_tracker_v1');
    if (raw) S = JSON.parse(raw);
  } catch(e){}
  if (!S.clients)      S.clients = [];
  if (S.month == null) S.month   = new Date().getMonth();
  if (S.year  == null) S.year    = new Date().getFullYear();
  if (S.updatedAt == null) S.updatedAt = 0;
  S.clients.forEach(normalizeClient);
  if (!S.activeClient && S.clients.length > 0) S.activeClient = S.clients[0].id;
}

const uid    = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const today  = () => new Date().toISOString().slice(0,10);
const toMins = (h,m) => { const hh=parseInt(String(h).trim())||0, mm=parseInt(String(m).trim())||0; return hh*60+mm; };
const toHrs  = m => m/60;
const fmtHM  = m => { if(!m) return '0h 0m'; const h=Math.floor(m/60),mn=m%60; return mn?h+'h '+mn+'m':h+'h'; };
const fmtINR = n => '\u20B9'+Math.round(n).toLocaleString('en-IN');
const eMins  = e => { if(e.minutes!=null) return Math.round(Number(e.minutes))||0; return Math.round((Number(e.hours)||0)*60); };
const esc    = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function getRate(c)    { return (c.customRate!=null&&c.customRate>0)?Number(c.customRate):Number(S.defaultRate)||0; }
function monthKey()    { return ''+S.year+'-'+S.month; }
function getAdvancePaid(c)   { return Number((c.advances||{})[monthKey()])||0; }
function setAdvancePaid(c,v) { if(!c.advances)c.advances={}; c.advances[monthKey()]=Number(v)||0; }
function getAdvanceCredit(c) { return Number((c.advanceCredits||{})[monthKey()])||0; }
function setAdvanceCredit(c,v){ if(!c.advanceCredits)c.advanceCredits={}; c.advanceCredits[monthKey()]=Number(v)||0; }
function getAdv(c)     { return getAdvancePaid(c)+getAdvanceCredit(c); }
function monthInputKey() { return S.year+'-'+String(S.month+1).padStart(2,'0'); }
function paymentInMonth(p) {
  const d=parseDate(p.date);
  return d.y===S.year && d.m===S.month;
}
function getLegacyAdvanceTotal(c) {
  const paid=Object.values(c.advances||{}).reduce((s,v)=>s+(Number(v)||0),0);
  const adjusted=Object.values(c.advanceCredits||{}).reduce((s,v)=>s+(Number(v)||0),0);
  return paid+adjusted;
}
function getOneTimeAgreed(c) {
  if (c.oneTimeLedgerEnabled) return (c.oneTimeParties||[]).reduce((s,p)=>s+(Number(p.agreedAmount)||0),0);
  return Number(c.oneTimeFee)||0;
}
function getPartyPaid(p) { return (p.payments||[]).reduce((s,x)=>s+(Number(x.amount)||0),0); }
function getOneTimePaid(c) {
  const legacy=c.includeLegacyOneTimeAdvances?getLegacyAdvanceTotal(c):0;
  return legacy+(c.oneTimeParties||[]).reduce((s,p)=>s+getPartyPaid(p),0);
}
function getOneTimePaidThisMonth(c) {
  const ledger=(c.oneTimeParties||[]).reduce((s,p)=>s+(p.payments||[]).filter(paymentInMonth).reduce((a,x)=>a+(Number(x.amount)||0),0),0);
  return (c.includeLegacyOneTimeAdvances?getAdv(c):0)+ledger;
}
function getPeriodCovered(c) {
  if(getBillingMode(c)!=='onetime') return getAdv(c);
  return !c.oneTimeFinalMonth || c.oneTimeFinalMonth===monthInputKey() ? getOneTimePaid(c) : getOneTimePaidThisMonth(c);
}
function parseDate(str) {
  // parse YYYY-MM-DD directly to avoid UTC timezone shift on iOS
  const p = str ? str.split('-') : [];
  if (p.length === 3) return { y: parseInt(p[0]), m: parseInt(p[1])-1 };
  const d = new Date(str); return { y: d.getFullYear(), m: d.getMonth() };
}
function mEntries(c) {
  return c.entries.filter(e => {
    const p = parseDate(e.date);
    return p.m === S.month && p.y === S.year;
  });
}
function earned(c)     { return clientEarnedAmount(c); }

function render() {
  document.getElementById('monthLabel').textContent = MONTHS[S.month]+' '+S.year;
  document.getElementById('defaultRate').value = S.defaultRate||'';
  renderSummary(); renderTabs(); renderPanel();
}

function renderSummary() {
  const te=S.clients.reduce((s,c)=>s+earned(c),0);
  const ta=S.clients.reduce((s,c)=>s+getPeriodCovered(c),0);
  const nc=te-ta;
  const tm=S.clients.reduce((s,c)=>s+mEntries(c).reduce((a,e)=>a+eMins(e),0),0);
  const ac=S.clients.filter(c=>mEntries(c).some(e=>eMins(e)>0)).length;
  document.getElementById('summaryRow').innerHTML=
    '<div class="summary-card c-green"><div class="sc-label">Total Earned</div><div class="sc-value" style="color:var(--accent)">'+fmtINR(te)+'</div><div class="sc-sub">'+MONTHS[S.month]+' '+S.year+'</div></div>'+
    '<div class="summary-card c-blue"><div class="sc-label">Advance Covered</div><div class="sc-value" style="color:var(--accent2)">'+fmtINR(ta)+'</div><div class="sc-sub">cash + adjustment</div></div>'+
    '<div class="summary-card c-pink"><div class="sc-label">'+(nc<0?'Covered Balance':'To Collect')+'</div><div class="sc-value" style="color:'+(nc<0?'var(--danger)':'var(--accent3)')+'">'+fmtINR(Math.abs(nc))+'</div><div class="sc-sub">'+(nc<0?'advance still available':'net of advance')+'</div></div>'+
    '<div class="summary-card"><div class="sc-label">Total Time</div><div class="sc-value" style="color:var(--text2);font-size:18px">'+fmtHM(tm)+'</div><div class="sc-sub">'+ac+' client'+(ac!==1?'s':'')+'</div></div>';
}

function renderTabs() {
  let h='';
  S.clients.forEach(c=>{
    h+='<button class="tab'+(c.id===S.activeClient?' active':'')+'" data-action="switch" data-id="'+c.id+'">'+esc(c.name)+'</button>';
  });
  h+='<button class="tab-add" data-action="open-modal">&#xFF0B; Add Client</button>';
  document.getElementById('tabsRow').innerHTML=h;
}

function getBillingMode(c) { return c.billingMode || 'hourly'; }

function clientEarnedAmount(c) {
  const mode = getBillingMode(c);
  const ents = mEntries(c);
  if (mode === 'hourly')   return ents.reduce((s,e) => s + toHrs(eMins(e)) * getRate(c), 0);
  if (mode === 'monthly')  return Number(c.monthlyFee) || 0;
  if (mode === 'onetime')  return !c.oneTimeFinalMonth || c.oneTimeFinalMonth===monthInputKey() ? getOneTimeAgreed(c) : 0;
  return 0;
}

function renderOneTimeLedger(c) {
  const parties=c.oneTimeParties||[];
  const agreed=getOneTimeAgreed(c);
  const paid=getOneTimePaid(c);
  const balance=agreed-paid;
  const legacy=getLegacyAdvanceTotal(c);
  let partyHtml='';
  parties.forEach(p=>{
    const partyPaid=getPartyPaid(p);
    const partyBalance=(Number(p.agreedAmount)||0)-partyPaid;
    const payments=[...(p.payments||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const paymentRows=payments.map(x=>
      '<div class="payment-row">'+
        '<span>'+esc(x.date||'No date')+'</span>'+
        '<strong style="color:var(--accent2)">'+fmtINR(x.amount||0)+'</strong>'+
        '<span class="payment-note">'+esc(x.note||'')+'</span>'+
        '<button class="mini-btn" data-action="del-party-payment" data-pid="'+p.id+'" data-payid="'+x.id+'" title="Delete payment">×</button>'+
      '</div>'
    ).join('');
    partyHtml+=
      '<div class="party-item">'+
        '<div class="party-main">'+
          '<div class="party-field"><label>Participant / fee group</label><input type="text" value="'+esc(p.name||'')+'" data-action="party-name" data-pid="'+p.id+'" placeholder="Person X or Person Y + Z"></div>'+
          '<div class="party-field"><label>Agreed amount</label><input type="text" inputmode="numeric" value="'+(p.agreedAmount||'')+'" data-action="party-agreed" data-pid="'+p.id+'" placeholder="0"></div>'+
          '<div class="party-stat"><div class="party-stat-label">Paid</div><div class="party-stat-value" style="color:var(--accent2)">'+fmtINR(partyPaid)+'</div></div>'+
          '<div class="party-stat"><div class="party-stat-label">Balance</div><div class="party-stat-value" style="color:'+(partyBalance>0?'var(--accent3)':'var(--accent)')+'">'+fmtINR(partyBalance)+'</div></div>'+
          '<button class="mini-btn" data-action="del-party" data-pid="'+p.id+'" title="Delete fee group">×</button>'+
        '</div>'+
        '<div class="party-payments">'+
          (paymentRows||'<div style="color:var(--text3);font-size:10px;">No payments recorded yet</div>')+
          '<div class="payment-add">'+
            '<input type="date" value="'+today()+'" data-role="payment-date" data-pid="'+p.id+'">'+
            '<input type="text" inputmode="numeric" placeholder="Amount" data-role="payment-amount" data-pid="'+p.id+'">'+
            '<input class="payment-note" type="text" placeholder="Payment note" data-role="payment-note" data-pid="'+p.id+'">'+
            '<button class="mini-btn add" data-action="add-party-payment" data-pid="'+p.id+'" title="Add payment">+</button>'+
          '</div>'+
        '</div>'+
      '</div>';
  });
  return '<div class="engagement-ledger">'+
    '<div class="engagement-head">'+
      '<div><div class="engagement-title">Engagement ledger</div><div class="engagement-sub">Amounts and payments carry across every month</div></div>'+
      '<div class="engagement-controls">'+
        '<div class="engagement-control"><label>Final billing month</label><input type="month" value="'+esc(c.oneTimeFinalMonth||'')+'" data-action="one-time-final-month"></div>'+
        '<div class="engagement-control"><label>Status</label><select data-action="one-time-status"><option value="active"'+((c.oneTimeStatus||'active')==='active'?' selected':'')+'>Active</option><option value="complete"'+(c.oneTimeStatus==='complete'?' selected':'')+'>Complete</option></select></div>'+
      '</div>'+
    '</div>'+
    '<div class="party-list">'+(partyHtml||'<div style="color:var(--text3);font-size:11px;">Add a participant or fee group to begin.</div>')+'</div>'+
    '<button class="party-add-btn" data-action="add-party">＋ Add participant / fee group</button>'+
    (legacy>0?'<label class="legacy-payments"><input type="checkbox" data-action="include-legacy-advances"'+(c.includeLegacyOneTimeAdvances?' checked':'')+'> Existing monthly advance records preserved: '+fmtINR(legacy)+' — include in engagement totals</label>':'')+
    '<div class="engagement-totals">'+
      '<div class="engagement-total"><span>Total agreed</span><strong>'+fmtINR(agreed)+'</strong></div>'+
      '<div class="engagement-total"><span>Total received / adjusted</span><strong style="color:var(--accent2)">'+fmtINR(paid)+'</strong></div>'+
      '<div class="engagement-total"><span>Remaining</span><strong style="color:'+(balance>0?'var(--accent3)':'var(--accent)')+'">'+fmtINR(balance)+'</strong></div>'+
    '</div>'+
  '</div>';
}

function renderPanel() {
  const panel=document.getElementById('clientPanel');
  if(!S.clients.length){panel.innerHTML='<div class="empty-state"><div class="big">🙌</div>Add a client to start logging</div>';return;}
  const c=S.clients.find(x=>x.id===S.activeClient);
  if(!c){panel.innerHTML='';return;}

  const mode  = getBillingMode(c);
  const rate  = getRate(c);
  const advPaid   = getAdvancePaid(c);
  const advCredit = getAdvanceCredit(c);
  const adv   = mode==='onetime'?getOneTimePaid(c):getAdv(c);
  const ents  = mEntries(c);
  const tMins = ents.reduce((s,e)=>s+eMins(e),0);
  const allTimeMins=c.entries.reduce((s,e)=>s+eMins(e),0);
  const earn  = mode==='onetime'?getOneTimeAgreed(c):clientEarnedAmount(c);
  const net   = earn - adv;
  const dot   = DOTS[S.clients.indexOf(c)%DOTS.length];
  const sorted= [...ents].sort((a,b)=>a.date.localeCompare(b.date));

  const hrOpts  = Array.from({length:24},(_,i)=>i);
  const minOpts = Array.from({length:60},(_,i)=>i);

  let rows='';
  if(!sorted.length){
    rows='<tr><td colspan="5" style="padding:24px;text-align:center;color:var(--text3);font-size:13px;">No entries for '+SHORT[S.month]+' '+S.year+'</td></tr>';
  } else {
    sorted.forEach(e=>{
      const mins=eMins(e), eH=Math.floor(mins/60), eM=mins%60;

      let timeCell='', amtCell='';

      if(mode==='hourly'){
        const hrSel='<select class="time-select" data-action="ehr" data-eid="'+e.id+'">'+
          hrOpts.map(h=>'<option value="'+h+'"'+(h===eH?' selected':'')+'>'+h+'</option>').join('')+'</select>';
        const minSel='<select class="time-select" data-action="emin" data-eid="'+e.id+'">'+
          minOpts.map(m=>'<option value="'+m+'"'+(m===eM?' selected':'')+'>'+String(m).padStart(2,'0')+'</option>').join('')+'</select>';
        timeCell='<div class="hm-wrap">'+hrSel+'<span class="hm-sep">h</span>'+minSel+'<span class="hm-sep">m</span></div>';
        amtCell=mins>0?fmtINR(toHrs(mins)*rate):'\u2014';
      } else if(mode==='monthly'){
        const hrSel='<select class="time-select" data-action="ehr" data-eid="'+e.id+'">'+
          hrOpts.map(h=>'<option value="'+h+'"'+(h===eH?' selected':'')+'>'+h+'</option>').join('')+'</select>';
        const minSel='<select class="time-select" data-action="emin" data-eid="'+e.id+'">'+
          minOpts.map(m=>'<option value="'+m+'"'+(m===eM?' selected':'')+'>'+String(m).padStart(2,'0')+'</option>').join('')+'</select>';
        timeCell='<div class="hm-wrap">'+hrSel+'<span class="hm-sep">h</span>'+minSel+'<span class="hm-sep">m</span></div>';
        amtCell='<span style="color:var(--text3);font-size:11px;">ref only</span>';
      } else if(mode==='onetime'){
        const hrSel='<select class="time-select" data-action="ehr" data-eid="'+e.id+'">'+
          hrOpts.map(h=>'<option value="'+h+'"'+(h===eH?' selected':'')+'>'+h+'</option>').join('')+'</select>';
        const minSel='<select class="time-select" data-action="emin" data-eid="'+e.id+'">'+
          minOpts.map(m=>'<option value="'+m+'"'+(m===eM?' selected':'')+'>'+String(m).padStart(2,'0')+'</option>').join('')+'</select>';
        timeCell='<div class="hm-wrap">'+hrSel+'<span class="hm-sep">h</span>'+minSel+'<span class="hm-sep">m</span></div>';
        amtCell='<span style="color:var(--text3);font-size:11px;">fixed fee</span>';
      }

      rows+='<tr class="entry-row" data-eid="'+e.id+'">'+
        '<td><input class="date-input" type="date" value="'+e.date+'" data-action="edate" data-eid="'+e.id+'"></td>'+
        '<td>'+timeCell+'</td>'+
        '<td class="amount-cell" id="amt-'+e.id+'">'+amtCell+'</td>'+
        '<td><input class="notes-input" type="text" placeholder="description..." maxlength="60" value="'+esc(e.notes||'')+'" data-action="enotes" data-eid="'+e.id+'"></td>'+
        '<td class="right"><button class="del-row-btn" data-action="del-entry" data-eid="'+e.id+'">\u2715</button></td>'+
        '</tr>';
    });
  }

  // billing mode selector
  const modes = [
    {v:'hourly',  label:'Per Hour'},
    {v:'monthly', label:'Per Month'},
    {v:'onetime', label:'One Time'}
  ];
  const modeHtml = '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">'+
    '<span class="override-label">Billing</span>'+
    modes.map(m=>
      '<button class="mode-btn'+(mode===m.v?' mode-active':'')+'" data-action="set-mode" data-mode="'+m.v+'">'+m.label+'</button>'
    ).join('')+
    '</div>';

  // extra config depending on mode
  let modeConfigHtml = '';
  if(mode==='hourly'){
    const crHtml = c.customRate!=null ?
      '<div class="client-custom-rate"><span style="color:var(--accent2);font-size:12px;">₹</span>'+
      '<input type="text" inputmode="numeric" value="'+c.customRate+'" data-action="crate" style="background:none;border:none;color:var(--accent2);font-family:\'DM Mono\',monospace;font-size:14px;font-weight:500;width:70px;outline:none;">'+
      '<span style="font-size:11px;color:var(--accent2);">/hr</span></div>' : '';
    modeConfigHtml =
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'+
        '<button class="override-toggle'+(c.customRate!=null?' active':'')+'" data-action="toggle-rate">'+(c.customRate!=null?'✓ Custom Rate':'+ Custom Rate')+'</button>'+
        crHtml+
        '<span style="font-size:11px;color:var(--text3);">₹'+rate+'/hr</span>'+
      '</div>';
  } else if(mode==='monthly'){
    modeConfigHtml =
      '<div style="display:flex;align-items:center;gap:8px;">'+
        '<span style="font-size:11px;color:var(--text3);">Monthly Fee</span>'+
        '<div class="client-custom-rate">'+
          '<span style="color:var(--accent);font-size:12px;">₹</span>'+
          '<input type="text" inputmode="numeric" placeholder="0" value="'+(c.monthlyFee||'')+'" data-action="monthly-fee" style="background:none;border:none;color:var(--accent);font-family:\'DM Mono\',monospace;font-size:14px;font-weight:500;width:90px;outline:none;">'+
          '<span style="font-size:11px;color:var(--text3);">/month</span>'+
        '</div>'+
      '</div>';
  } else if(mode==='onetime'){
    modeConfigHtml =
      '<span style="font-size:11px;color:var(--text3);">Log hours monthly; manage agreed fees and payments in the engagement ledger.</span>';
  }

  // footer earned label varies by mode
  const earnLabel = mode==='hourly'?'Earned':mode==='monthly'?'Monthly Fee':'Total Agreed';
  const timeFooter = mode==='onetime' ?
    '<div class="footer-stat"><div class="footer-stat-label">'+SHORT[S.month]+' Time</div><div class="footer-stat-value" style="color:var(--accent2)">'+fmtHM(tMins)+'</div></div>'+
    '<div class="footer-stat"><div class="footer-stat-label">Till Date</div><div class="footer-stat-value" style="color:var(--accent2)">'+fmtHM(allTimeMins)+'</div></div>' :
    '<div class="footer-stat"><div class="footer-stat-label">Time</div><div class="footer-stat-value" style="color:var(--accent2)">'+fmtHM(tMins)+'</div></div>';

  // table header varies
  const thTime = '<th>Time</th>';
  const thAmt  = mode==='onetime' ? '<th>Fee</th>' : '<th>Amount</th>';

  panel.innerHTML=
    '<div class="client-panel">'+
      '<div class="client-panel-header">'+
        '<div class="client-name-wrap">'+
          '<div class="client-dot" style="background:'+dot+'"></div>'+
          '<input type="text" class="client-name-input" value="'+esc(c.name)+'" maxlength="30" data-action="cname">'+
        '</div>'+
        '<button class="delete-client-btn" data-action="del-client">🗑</button>'+
      '</div>'+
      '<div style="padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;flex-direction:column;gap:10px;">'+
        modeHtml+
        modeConfigHtml+
      '</div>'+
      (mode==='onetime'?renderOneTimeLedger(c):'')+
      '<div class="log-table-wrap"><table class="log-table">'+
        '<thead><tr><th>Date</th>'+thTime+thAmt+'<th>Notes</th><th></th></tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table></div>'+
      '<div class="add-row-area"><button class="add-row-btn" data-action="add-entry">＋ Add entry</button></div>'+
      (mode==='onetime'?'':'<div class="advance-row">'+
        '<span class="advance-label">💰 Advance</span>'+
        '<div class="advance-field">'+
          '<span class="advance-field-label">Paid now</span>'+

function updateFooterInPlace(c) {
  const earn = clientEarnedAmount(c);
  const adv  = getAdv(c);
  const net  = earn - adv;
  // update earned value — find by label since id isn't set on it
  const footer = document.querySelector('.client-footer');
  if (!footer) return;
  const stats = footer.querySelectorAll('.footer-stat-value');
  // earned is second-to-last stat (before adv and net)
  if (stats.length >= 3) stats[stats.length-3].textContent = fmtINR(earn);
  const fa = document.getElementById('ftr-adv');
  const fn = document.getElementById('ftr-net');
  if (fa) fa.textContent = fmtINR(adv);
  if (fn) { fn.textContent = fmtINR(net); fn.style.color = net<0?'var(--danger)':'var(--accent)'; }
}

function updateAdvanceInPlace(c) {
  const adv = getAdv(c);
  const earn = earned(c);
  const net = earn - adv;
  const total = document.getElementById('advance-total');
  const fa = document.getElementById('ftr-adv');
  const fn = document.getElementById('ftr-net');
  if (total) total.textContent = fmtINR(adv);
  if (fa) fa.textContent = fmtINR(adv);
  if (fn) { fn.textContent = fmtINR(net); fn.style.color = net<0?'var(--danger)':'var(--accent)'; }
}

function openModal()  { document.getElementById('addModal').classList.add('open'); setTimeout(()=>document.getElementById('newClientName').focus(),80); }
function closeModal() { document.getElementById('addModal').classList.remove('open'); }
function confirmAdd() {
  const name=document.getElementById('newClientName').value.trim();
  if(!name){showToast('Enter a client name');return;}
  const c={id:uid(),name,customRate:null,advances:{},advanceCredits:{},oneTimeParties:[],entries:[]};

function showToast(msg) {

function changeMonth(d) {
  S.month+=d;
  if(S.month>11){S.month=0;S.year++;}
  if(S.month<0){S.month=11;S.year--;}
  save(); render();
}

document.addEventListener('click', function(e) {
  const el=e.target.closest('[data-action]');
  if(!el) return;
  const act=el.dataset.action;
  if(act==='open-modal')  {openModal();return;}
  if(act==='switch')      {S.activeClient=el.dataset.id;save();renderTabs();renderPanel();return;}
  if(act==='del-entry')   {delEntry(el.dataset.eid);return;}
  if(act==='add-entry')   {addEntry();return;}
  if(act==='del-client')  {delClient();return;}
  if(act==='export-client'){exportClientCSV();return;}
  if(act==='toggle-rate') {toggleRate();return;}
  if(act==='add-party')   {addOneTimeParty();return;}
  if(act==='del-party')   {delOneTimeParty(el.dataset.pid);return;}
  if(act==='add-party-payment'){addPartyPayment(el.dataset.pid);return;}
  if(act==='del-party-payment'){delPartyPayment(el.dataset.pid,el.dataset.payid);return;}
  if(act==='set-mode')    {
    const c=S.clients.find(x=>x.id===S.activeClient);
    if(!c) return;
    c.billingMode=el.dataset.mode;
    if(c.billingMode==='onetime' && c.oneTimeLedgerEnabled==null){c.oneTimeLedgerEnabled=true;if(!c.oneTimeParties)c.oneTimeParties=[];}
    save();renderPanel();renderSummary();
    return;
  }
});

document.addEventListener('input', function(e) {
  const el=e.target;
  const act=el.dataset?el.dataset.action:null;
  if(!act) return;
  if(el.id==='defaultRate'){S.defaultRate=Number(el.value)||0;save();renderSummary();renderPanel();return;}
  const c=S.clients.find(x=>x.id===S.activeClient);
  if(!c) return;
  if(act==='cname')  {c.name=el.value||'Client';save();renderTabs();return;}
  if(act==='crate')  {c.customRate=Number(el.value)||0;save();renderSummary();renderPanel();return;}
  if(act==='monthly-fee'||act==='one-time-fee'||act==='party-name'||act==='party-agreed'||act==='efixedamt'){
    // do nothing on input — save on blur only to prevent iOS keyboard dismissal
    return;
  }
  if(act==='advance'){
    setAdvancePaid(c,el.value);save();renderSummary();updateAdvanceInPlace(c);
    return;
  }
  if(act==='advance-credit'){
    setAdvanceCredit(c,el.value);save();renderSummary();updateAdvanceInPlace(c);
    return;
  }
  if(act==='edate'){
    const entry=c.entries.find(x=>x.id===el.dataset.eid);
    if(entry){entry.date=el.value;save();renderPanel();renderSummary();}
    return;
  }
  if(act==='enotes'){
    const entry=c.entries.find(x=>x.id===el.dataset.eid);
    if(entry){entry.notes=el.value;save();}
    return;
  }
  if(act==='ehr'||act==='emin'){
    const entry=c.entries.find(x=>x.id===el.dataset.eid);
    if(!entry) return;
    // get sibling select values directly from the DOM — selects always return correct values
    const row  = el.closest('tr');
    const hSel = row.querySelector('[data-action="ehr"]');
    const mSel = row.querySelector('[data-action="emin"]');
    const hv   = hSel ? parseInt(hSel.value)||0 : Math.floor((entry.minutes||0)/60);
    const mv   = mSel ? parseInt(mSel.value)||0 : (entry.minutes||0)%60;
    entry.minutes = hv*60 + mv;
    delete entry.hours;
    delete entry._hr; delete entry._min;
    save();
    const amtEl=document.getElementById('amt-'+entry.id);
    if(amtEl) amtEl.textContent=entry.minutes>0?fmtINR(toHrs(entry.minutes)*getRate(c)):'\u2014';
    renderSummary();
    return;
  }
});

    const hSel=row?row.querySelector('[data-action="ehr"]'):null;
    const mSel=row?row.querySelector('[data-action="emin"]'):null;

    const mv=mSel?parseInt(mSel.value)||0:(entry.minutes||0)%60;

});

// blur handler — saves monthly-fee and efixedamt ONLY when user leaves the field
// this completely avoids iOS keyboard dismissal on every keystroke
document.addEventListener('blur', function(e) {
  const el  = e.target;
  const act = el.dataset ? el.dataset.action : null;
  if (!act) return;
  const c = S.clients.find(x => x.id === S.activeClient);
  if (!c) return;
  if (act === 'monthly-fee') {
    c.monthlyFee = Number(el.value) || 0;
    save(); renderSummary(); updateFooterInPlace(c);
    return;
  }
  if (act === 'one-time-fee') {
    c.oneTimeFee = Number(el.value.replace(/[^0-9.]/g,'')) || 0;
    save(); renderSummary(); updateFooterInPlace(c);
    return;
  }
  if (act === 'party-name') {
    const party=(c.oneTimeParties||[]).find(x=>x.id===el.dataset.pid);
    if(!party) return;
    party.name=el.value.trim()||'Unnamed participant';
    save();renderPanel();
    return;
  }
  if (act === 'party-agreed') {
    const party=(c.oneTimeParties||[]).find(x=>x.id===el.dataset.pid);
    if(!party) return;
    party.agreedAmount=Number(el.value.replace(/[^0-9.]/g,''))||0;
    save();renderSummary();renderPanel();
    return;
  }
  if (act === 'efixedamt') {
    const entry = c.entries.find(x => x.id === el.dataset.eid);
    if (!entry) return;
    entry.fixedAmt = Number(el.value.replace(/[^0-9.]/g,'')) || 0;
    save(); renderSummary(); updateFooterInPlace(c);
    return;
  }
}, true); // useCapture=true so it fires on iOS

function addEntry(){
  const c=S.clients.find(x=>x.id===S.activeClient);
  if(!c) return;
  const mode=getBillingMode(c);
  c.entries.push({id:uid(),date:today(),minutes:0,notes:'',fixedAmt:0});
  save();renderPanel();renderSummary();
  setTimeout(()=>{const ins=document.querySelectorAll('[data-action="ehr"]');if(ins.length)ins[ins.length-1].focus();},50);
}
function delEntry(eid){
  const c=S.clients.find(x=>x.id===S.activeClient);
  if(!c) return;
  c.entries=c.entries.filter(e=>e.id!==eid);
  save();renderPanel();renderSummary();
}
function delClient(){
  const c=S.clients.find(x=>x.id===S.activeClient);
  if(!c||!confirm('Delete "'+c.name+'" and all entries?')) return;
  S.clients=S.clients.filter(x=>x.id!==c.id);
  S.activeClient=S.clients.length?S.clients[0].id:null;
  save();render();
}
function toggleRate(){
  const c=S.clients.find(x=>x.id===S.activeClient);
  if(!c) return;
  c.customRate=c.customRate!=null?null:(S.defaultRate||0);
  save();renderPanel();renderSummary();
}

function addOneTimeParty(){
  const c=S.clients.find(x=>x.id===S.activeClient);
  if(!c) return;
  if(!Array.isArray(c.oneTimeParties)) c.oneTimeParties=[];
  c.oneTimeLedgerEnabled=true;
  c.oneTimeParties.push({id:uid(),name:'New participant',agreedAmount:0,payments:[]});
  save();renderPanel();renderSummary();
}
function delOneTimeParty(pid){
  const c=S.clients.find(x=>x.id===S.activeClient);
  if(!c) return;
  const party=(c.oneTimeParties||[]).find(x=>x.id===pid);
  if(!party||!confirm('Delete "'+party.name+'" and all payment records under it?')) return;
  c.oneTimeParties=c.oneTimeParties.filter(x=>x.id!==pid);
  save();renderPanel();renderSummary();
}
function addPartyPayment(pid){
  const c=S.clients.find(x=>x.id===S.activeClient);
  const party=c&&(c.oneTimeParties||[]).find(x=>x.id===pid);
  if(!party) return;
  const dateEl=document.querySelector('[data-role="payment-date"][data-pid="'+pid+'"]');
  const amountEl=document.querySelector('[data-role="payment-amount"][data-pid="'+pid+'"]');
  const noteEl=document.querySelector('[data-role="payment-note"][data-pid="'+pid+'"]');
  const amount=Number(String(amountEl?amountEl.value:'').replace(/[^0-9.]/g,''))||0;
  if(!amount){showToast('Enter a payment amount');return;}
  party.payments.push({id:uid(),date:(dateEl&&dateEl.value)||today(),amount,note:(noteEl&&noteEl.value.trim())||''});
  save();renderPanel();renderSummary();
}
function delPartyPayment(pid,payid){
  const c=S.clients.find(x=>x.id===S.activeClient);
  const party=c&&(c.oneTimeParties||[]).find(x=>x.id===pid);
  const payment=party&&(party.payments||[]).find(x=>x.id===payid);
  if(!payment||!confirm('Delete the '+fmtINR(payment.amount||0)+' payment dated '+(payment.date||'unknown')+'?')) return;
  party.payments=party.payments.filter(x=>x.id!==payid);
  save();renderPanel();renderSummary();
}

function oneTimeTimeSummaryCSV(c){
  const byMonth={};
  (c.entries||[]).forEach(e=>{
    const p=parseDate(e.date);
    if(!Number.isFinite(p.y)||!Number.isFinite(p.m)) return;
    const key=p.y+'-'+String(p.m+1).padStart(2,'0');
    if(!byMonth[key]) byMonth[key]={minutes:0,sessions:0};
    byMonth[key].minutes+=eMins(e);
    byMonth[key].sessions++;
  });
  let totalMinutes=0,totalSessions=0;
  let csv='TIME SUMMARY\nMonth,Sessions,Time Logged\n';
  Object.keys(byMonth).sort().forEach(key=>{
    const parts=key.split('-'), label=MONTHS[Number(parts[1])-1]+' '+parts[0];
    const row=byMonth[key];
    totalMinutes+=row.minutes;totalSessions+=row.sessions;
    csv+='"'+label+'",'+row.sessions+',"'+fmtHM(row.minutes)+'"\n';
  });
  csv+='"Till Date",'+totalSessions+',"'+fmtHM(totalMinutes)+'"\n\n';
  return csv;
}

function exportCSV(){
  const month=MONTHS[S.month];
  let csv='Arjun FL Hours Tracker - '+month+' '+S.year+'\n\n';
  S.clients.forEach(c=>{
    const mode=getBillingMode(c);
    csv+='"'+c.name+'" ('+mode+')\n';
    if(mode==='hourly'){
      csv+='Date,Time,Decimal Hours,Rate,Amount,Notes\n';
      const rate=getRate(c);
      mEntries(c).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
        const m=eMins(e);
        csv+='"'+e.date+'","'+fmtHM(m)+'",'+toHrs(m).toFixed(2)+','+rate+','+(toHrs(m)*rate).toFixed(2)+',"'+(e.notes||'')+'"\n';
      });
    } else if(mode==='monthly'){
      csv+='Monthly Fee: Rs'+(c.monthlyFee||0)+'\n';
      csv+='Date,Time (ref),Notes\n';
      mEntries(c).sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
        csv+='"'+e.date+'","'+fmtHM(eMins(e))+'","'+(e.notes||'')+'"\n';
      });
    } else if(mode==='onetime'){
      const agreed=getOneTimeAgreed(c),received=getOneTimePaid(c);
      csv+='Status,'+(c.oneTimeStatus||'active')+'\n';
      csv+='Final Billing Month,'+(c.oneTimeFinalMonth||'Not set')+'\n';
      csv+='Total Agreed,Rs'+agreed.toFixed(2)+'\n';
      csv+='Total Received / Adjusted,Rs'+received.toFixed(2)+'\n';
      csv+='Remaining,Rs'+(agreed-received).toFixed(2)+'\n\n';
      csv+='FEE GROUPS\nParticipant / Group,Agreed,Paid,Balance\n';
      (c.oneTimeParties||[]).forEach(p=>{const pp=getPartyPaid(p);csv+='"'+(p.name||'')+'",Rs'+(Number(p.agreedAmount)||0).toFixed(2)+',Rs'+pp.toFixed(2)+',Rs'+((Number(p.agreedAmount)||0)-pp).toFixed(2)+'\n';});
      csv+='\nPAYMENTS\nParticipant / Group,Date,Amount,Note\n';
      (c.oneTimeParties||[]).forEach(p=>(p.payments||[]).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(x=>{csv+='"'+(p.name||'')+'","'+(x.date||'')+'",Rs'+(Number(x.amount)||0).toFixed(2)+',"'+(x.note||'')+'"\n';}));
      csv+='\n'+oneTimeTimeSummaryCSV(c);
      csv+='WORK LOG\nDate,Time (logged),Notes\n';
      [...c.entries].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
        csv+='"'+e.date+'","'+fmtHM(eMins(e))+'","'+(e.notes||'')+'"\n';
      });
    }
    csv+='\n';
  });
  csv+='\nSUMMARY\nClient,Billing Mode,Earned,Paid Now,Old Payable Adjusted,Advance Covered,Net to Invoice\n';
  let gE=0,gA=0;
  S.clients.forEach(c=>{
    const isOneTime=getBillingMode(c)==='onetime';
    const earn=clientEarnedAmount(c),paid=isOneTime?getOneTimePaidThisMonth(c):getAdvancePaid(c),credit=isOneTime?0:getAdvanceCredit(c),adv=isOneTime?paid:getAdv(c);
    gE+=earn;gA+=adv;
    csv+='"'+c.name+'",'+getBillingMode(c)+',Rs'+earn.toFixed(2)+',Rs'+paid.toFixed(2)+',Rs'+credit.toFixed(2)+',Rs'+adv.toFixed(2)+',Rs'+(earn-adv).toFixed(2)+'\n';
  });
  csv+='\nGRAND TOTAL,,Rs'+gE.toFixed(2)+',,,Rs'+gA.toFixed(2)+',Rs'+(gE-gA).toFixed(2)+'\n';
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='arjun_hours_'+month+'_'+S.year+'.csv';
  a.click();
  showToast('CSV exported!');
}

    (c.oneTimeParties||[]).forEach(p=>{const pp=getPartyPaid(p);csv+='"'+(p.name||'')+'",Rs'+(Number(p.agreedAmount)||0).toFixed(2)+',Rs'+pp.toFixed(2)+',Rs'+((Number(p.agreedAmount)||0)-pp).toFixed(2)+'\n';});
    csv+='\nPAYMENTS\nParticipant / Group,Date,Amount,Note\n';
    (c.oneTimeParties||[]).forEach(p=>(p.payments||[]).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(x=>{csv+='"'+(p.name||'')+'","'+(x.date||'')+'",Rs'+(Number(x.amount)||0).toFixed(2)+',"'+(x.note||'')+'"\n';}));
    csv+='\n'+oneTimeTimeSummaryCSV(c);
    csv+='WORK LOG\nDate,Time (logged),Notes\n';
    [...c.entries].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
      csv+='"'+e.date+'","'+fmtHM(eMins(e))+'","'+(e.notes||'')+'"\n';
    });
  }
  if(mode!=='onetime'){
    csv+='\nSUMMARY\nEarned,Paid Now,Old Payable Adjusted,Advance Covered,Net to Invoice\n';
    csv+='Rs'+earn.toFixed(2)+',Rs'+paid.toFixed(2)+',Rs'+credit.toFixed(2)+',Rs'+adv.toFixed(2)+',Rs'+(earn-adv).toFixed(2)+'\n';
  }
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=c.name.replace(/[^a-z0-9]+/gi,'_')+(mode==='onetime'?'_full_engagement':'_'+month+'_'+S.year)+'.csv';
  a.click();
  showToast('Exported '+c.name);
}

// ── Google Drive cloud sync (appDataFolder, last-write-wins) ─────────────────
const Cloud = {
  token: null,
  tokenExpiry: 0,
  tokenClient: null,
  fileId: localStorage.getItem(LS_FILEID_KEY) || null,
  busy: false,
  pushTimer: null,

  ready() { return GDRIVE_CLIENT_ID && GDRIVE_CLIENT_ID !== 'YOUR_CLIENT_ID.apps.googleusercontent.com'; },

  initGis() {
    if (this.tokenClient || !window.google || !google.accounts) return;
    this.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GDRIVE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: () => {} // set per-request
    });
  },

  // Get a valid access token. silent=true reuses cached token; false may prompt.
  getToken(silent = true) {
    this.initGis();
    if (!this.tokenClient) return Promise.reject(new Error('GIS not loaded'));
    const now = Date.now();
    if (this.token && this.tokenExpiry > now + 5000) return Promise.resolve(this.token);
    return new Promise((resolve, reject) => {
      this.tokenClient.callback = (resp) => {
        if (resp.error || !resp.access_token) { reject(new Error(resp.error_description || resp.error || 'Auth failed')); return; }
        this.token = resp.access_token;
        this.tokenExpiry = now + (resp.expires_in ? resp.expires_in * 1000 : 3300000);
        resolve(this.token);
      };
      this.tokenClient.requestAccessToken({ prompt: silent ? '' : 'consent' });
    });
  },

  async authHeaders() {
    // silent=true reuses cached token / silent consent grant — avoids forcing
    // the Google consent popup on every launch. Only the manual ☁ button and
    // error-retry paths should force a fresh consent prompt.
    const tok = await this.getToken(true);
    return { 'Authorization': 'Bearer ' + tok };
  },

  setUI(state, label) {
    const btn = document.getElementById('syncBtn');
    const lbl = document.getElementById('syncLabel');
    if (!btn) return;
    btn.classList.remove('syncing','synced','error','off');
    btn.classList.add(state);
    if (lbl && label) lbl.textContent = label;
  },

  // Find existing state file in appDataFolder, return {id, modifiedTime}
  async findFile() {
    const q = encodeURIComponent("name='" + DRIVE_STATE_FILE + "' and trashed=false");
    const url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + q + '&fields=files(id,modifiedTime)';
    const r = await fetch(url, { headers: await this.authHeaders() });
    if (!r.ok) throw new Error('Drive list failed: ' + r.status);
    const data = await r.json();
    return data.files && data.files[0] ? data.files[0] : null;
  },

  // Download cloud state. Returns parsed object or null.
  async download(fileId) {
    const r = await fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media', { headers: await this.authHeaders() });
    if (!r.ok) throw new Error('Drive download failed: ' + r.status);
    return r.json();
  },

  // Create or update the state file with current S.
  async upload() {
    const body = JSON.stringify(S);
    // Resolve fileId if missing (or if cached id no longer exists).
    if (!this.fileId) {
      const f = await this.findFile();
      if (f) this.fileId = f.id;
    }
    let r;
    if (this.fileId) {
      // update existing file content only (media upload)
      r = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + this.fileId + '?uploadType=media', {
        method: 'PATCH', headers: { ...(await this.authHeaders()), 'Content-Type': 'application/json' }, body
      });
      if (r.status === 404) { // file was deleted remotely — reset and create fresh
        this.fileId = null; localStorage.removeItem(LS_FILEID_KEY);
        return this.upload();
      }
    } else {
      // create new file in appDataFolder via multipart
      const boundary = 'fl' + Date.now();
      const part = (ctype, content) => '--' + boundary + '\r\nContent-Type: ' + ctype + '\r\n\r\n' + content + '\r\n';
      const multipart = part('application/json; charset=UTF-8', JSON.stringify({ name: DRIVE_STATE_FILE, parents: ['appDataFolder'] })) + part('application/json', body) + '--' + boundary + '--';
      r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST', headers: { ...(await this.authHeaders()), 'Content-Type': 'multipart/related; boundary=' + boundary }, body: multipart
      });
    }
    if (!r.ok) throw new Error('Drive upload failed: ' + r.status);
    const data = await r.json();
    if (data.id) { this.fileId = data.id; localStorage.setItem(LS_FILEID_KEY, data.id); }
  },

  // Pull cloud state and reconcile using updatedAt (last-write-wins).
  async pull() {
    if (!this.ready()) { this.setUI('off', 'Not configured'); return; }
    if (this.busy) return;
    this.busy = true;
    this.setUI('syncing', 'Syncing…');
    try {
      const f = await this.findFile();
      if (!f) {
        // No cloud file yet — push current state up (first device).
        await this.upload();
        this.setUI('synced', 'Cloud ready');
        return;
      }
      this.fileId = f.id; localStorage.setItem(LS_FILEID_KEY, f.id);
      const cloud = await this.download(f.id);
      const cloudTs = cloud.updatedAt || 0;
      const localTs = S.updatedAt || 0;
      if (cloudTs > localTs) {
        // Cloud is newer — adopt it.
        S = cloud;
        if (!S.clients) S.clients = [];
        S.clients.forEach(normalizeClient);
        if (S.updatedAt == null) S.updatedAt = cloudTs;
        try { localStorage.setItem('arjun_fl_v1', JSON.stringify(S)); } catch(e){}
        render();
        showToast('Synced from cloud');
        this.setUI('synced', 'Synced');
      } else {
        // Local is newer or equal — push up.
        await this.upload();
        this.setUI('synced', 'Synced');
      }
    } catch (e) {
      this.setUI('error', 'Sync error');
      console.warn('Cloud pull failed:', e.message);
    } finally {
      this.busy = false;
    }
  },

  // Debounced push triggered by save().
  schedulePush() {
    if (!this.ready()) return;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.push(), 2500);
  },

  // Push current state up (used by debounced save + manual button).
  async push() {
    if (!this.ready()) return;
    if (this.busy) { this.schedulePush(); return; }
    this.busy = true;
    this.setUI('syncing', 'Saving…');
    try {
      await this.upload();
      this.setUI('synced', 'Synced');
    } catch (e) {
      // Token may have expired mid-session — retry once with fresh consent.
      this.token = null; this.tokenExpiry = 0;
      try { await this.upload(); this.setUI('synced', 'Synced'); }
      catch (e2) { this.setUI('error', 'Sync error'); console.warn('Cloud push failed:', e2.message); }
    } finally {
      this.busy = false;
    }
  }
};
function scheduleCloudPush() { Cloud.schedulePush(); }

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', {scope: './'}).catch(()=>{});

// ── Cloud sync wiring ─────────────────────────────────────────────────────────
if (Cloud.ready()) {
  Cloud.setUI('off', 'Tap to sync');
  // initial pull shortly after load (gives GIS time to load)
  setTimeout(() => Cloud.pull().catch(()=>{}), 1200);
} else {
  Cloud.setUI('off', 'Not configured');
}
document.getElementById('syncBtn').addEventListener('click', () => {
  if (!Cloud.ready()) { showToast('Set GDRIVE_CLIENT_ID in index.html'); return; }
  Cloud.pull().catch(()=>{});
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Cloud.ready()) {
    Cloud.pull().catch(()=>{});
  }
});
